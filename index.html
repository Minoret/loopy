    <!-- Librerías para generación de PDF -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body style="opacity:0">

    <!-- Loopy & Ink -->
    <div id="canvasses">
        <div id="grid-overlay">
            <div class="grid-cell">Atención</div>
            <div class="grid-cell">Cognición</div>
            <div class="grid-cell">Self</div>
            <div class="grid-cell">Afecto</div>
            <div class="grid-cell">Conducta</div>
            <div class="grid-cell">Motivación</div>
            <div class="grid-cell">Biofisiológico</div>
            <div class="grid-cell">Contexto</div>
            <div class="grid-cell">Sociocultural</div>
        </div>
    </div>

    <!-- Extra Buttons (Centrar & MMEE) -->
    <div id="extra-buttons">
        <!-- Recenter Button -->
        <button id="recenter-button" title="Centrar Vista">
            <span class="button-tag">Centrar</span>
            <img src="https://images.icon-icons.com/1863/PNG/512/center-focus-strong_119304.png" alt="Centrar" style="width:24px;height:24px;">
        </button>

        <!-- Grid Toggle Button -->
        <button id="grid-toggle" title="MetaModelo Evolutivo Extendido (MMEE)">
            <span class="button-tag">MMEE</span>
            <img src="https://img.icons8.com/material-outlined/24/ffffff/grid.png" alt="Grilla" style="width:24px;height:24px;">
        </button>
    </div>

    <!-- Sidebar Toggle Button -->
    <button id="sidebar-toggle" title="Alternar Menú">
        <img src="https://img.icons8.com/material-outlined/24/ffffff/menu--v1.png" alt="Menú" style="width:24px;height:24px;">
    </button>

    <!-- The Tools' UI -->
    <div id="toolbar"></div>
    <div id="playbar"></div>
    <div id="sidebar"></div>

    <!-- MODAL -->
    <div id="modal_container">
        <div id="modal_bg"></div>
        <div id="modal">
            <div id="modal_close">[×] CERRAR</div>
            <div id="modal_page"></div>
        </div>
    </div>

    <!-- En Medio del Contexto link con imagen -->
    <a href="https://enmediodelcontexto.com.ar" class="contexto-link" target="_blank">
        <img src="https://enmediodelcontexto.com.ar/wp-content/uploads/2025/11/EMC-white-cropped.png" alt="En Medio del Contexto">
    </a>

<!-- Scripts! -->

<!-- Libraries -->
<script src="js/helpers.js"></script>
<script src="js/Mouse.js"></script>
<script src="js/Key.js"></script>
<script src="js/Panner.js"></script>

<!-- Core Simulation Code -->
<script src="js/Loopy.js?v=6"></script>
<script src="js/Model.js?v=3"></script>
<script src="js/Node.js?v=4"></script>
<script src="js/Edge.js?v=2"></script>
<script src="js/NIRA.js?v=1"></script>
<script src="js/Label.js"></script>

<!-- Tools -->
<script src="js/PageUI.js"></script>
<script src="js/Sidebar.js?v=3"></script>
<script src="js/Toolbar.js"></script>
<script src="js/PlayControls.js"></script>
<script src="js/Modal.js?v=4"></script>
<script src="js/Ink.js"></script>
<script src="js/Dragger.js"></script>
<script src="js/Eraser.js"></script>
<script src="js/Labeller.js"></script>

<!-- Start it -->
<script>
window.onload = function(){

    // Grid toggle UI sync
    var gridToggle = document.getElementById('grid-toggle');
    var gridOverlay = document.getElementById('grid-overlay');
    subscribe("grid/toggle", function(show) {
        if (show) {
            gridOverlay.classList.add('show');
        } else {
            gridOverlay.classList.remove('show');
        }
    });

    // Start Loopy
    window.loopy = new Loopy();

    // Grid toggle logic
    gridToggle.onclick = function() {
        var tag = this.querySelector('.button-tag');
        if(tag) tag.remove();
        window.loopy.showGrid = !window.loopy.showGrid;
        publish("grid/toggle", [window.loopy.showGrid]);
        publish("model/changed");
    };

    // Sidebar toggle logic
    var sidebarToggle = document.getElementById('sidebar-toggle');
    var sidebar = document.getElementById('sidebar');
    sidebarToggle.onclick = function() {
        if (sidebar.classList.contains('show')) {
            sidebar.classList.remove('show');
        } else {
            sidebar.classList.add('show');
        }
    };

    // Recenter button logic
    var recenterButton = document.getElementById('recenter-button');
    recenterButton.onclick = function() {
        var tag = this.querySelector('.button-tag');
        if(tag) tag.remove();
        window.loopy.model.center(true);
        publish("resize");
    };

    // Auto-show sidebar when editing
    subscribe("sidebar/show", function() {
        sidebar.classList.add('show');
    });

};
</script>
</body>
</html>
